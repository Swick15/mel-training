<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151C26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mel's Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mel's Training Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; the session is a stack of block cards; timers take over the full screen like a gym clock */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --ink:#151C26; --muted:#5A6676; --line:#DCE2E9;
  --accent:#C92E5A; --accent-ink:#FFFFFF; --soft:#FBE6ED; --good:#2C7A4E; --on-good:#FFFFFF; --focus:#1D6F82;
  --hero:#151C26; --hero-fg:#F3F5F8; --hero-muted:#A9B4C2;
  --tbg:#121821; --tfg:#F3F5F8; --tmuted:#9AA6B5; --tline:#2B3644; --thard:#A81F48; --teasy:#155E6B;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --surface:#171E27; --ink:#EDF1F5; --muted:#98A4B3; --line:#29333F;
  --accent:#FF5E89; --accent-ink:#22060F; --soft:#3A1523; --good:#5BC489; --on-good:#08200F; --focus:#5FC2D6;
  --hero:#1E2731; --hero-fg:#F3F5F8; --hero-muted:#A3AEBB;
  --tbg:#090C10; --tfg:#F3F5F8; --tmuted:#8E9AA9; --tline:#232C37; --thard:#9C1C43; --teasy:#12515C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#171E27; --ink:#EDF1F5; --muted:#98A4B3; --line:#29333F;
  --accent:#FF5E89; --accent-ink:#22060F; --soft:#3A1523; --good:#5BC489; --on-good:#08200F; --focus:#5FC2D6;
  --hero:#1E2731; --hero-fg:#F3F5F8; --hero-muted:#A3AEBB;
  --tbg:#090C10; --tfg:#F3F5F8; --tmuted:#8E9AA9; --tline:#232C37; --thard:#9C1C43; --teasy:#12515C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:34rem;margin:0 auto;padding-inline:16px;padding-block:14px 64px;display:grid;gap:22px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:2.6rem;letter-spacing:.005em}
h2{font-size:1.35rem;letter-spacing:.03em}
h3{font-size:1.55rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{display:grid;gap:12px}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog .wk{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.prog i{height:8px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--accent)}
.progline{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

/* next up */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:18px;padding:20px;display:grid;gap:14px}
.hero .eyebrow{color:var(--hero-muted)}
.hero h2{font-size:3rem;line-height:.9}
.hero .meta{color:var(--hero-muted);font-size:.95rem}
.hero .last{border-top:1px solid color-mix(in srgb,var(--hero-fg) 18%,transparent);padding-top:12px;font-size:.92rem}
.hero .last b{color:var(--hero-fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;border:0;font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;font-size:.95rem}

/* week list */
.week{display:grid;gap:4px}
.week h2{display:flex;justify-content:space-between;align-items:baseline}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.row:last-child{border-bottom:0}
.day{font-family:var(--display);font-weight:700;font-size:1.05rem;width:2.4rem;flex:none;color:var(--muted);text-transform:uppercase}
.row .body{flex:1;min-width:0}
.row .name{font-weight:700}
.row .meta{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.row.next .day{color:var(--accent)}
.tick{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:transparent;padding:0}
.tick svg{width:15px;height:15px;opacity:0}
.tick.on{background:var(--good);border-color:var(--good);color:var(--on-good)}
.tick.on svg{opacity:1}
.chev{color:var(--muted);flex:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:6.2rem 1fr;gap:10px;font-size:.92rem}
.rules b{font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.02em}

/* session */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;font-weight:700;color:var(--muted)}
.shead{display:grid;gap:8px}
.beat{background:var(--soft);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.beat b{font-family:var(--display);font-size:1.6rem;text-transform:uppercase;line-height:1}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.block.done{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.bhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.bhead .eyebrow{margin-bottom:4px}
.moves{list-style:none;margin:0;padding:0}
.moves li{display:grid;grid-template-columns:3.2rem 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.reps{font-family:var(--display);font-weight:700;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1}
.mname{font-weight:600}
.mx{font-size:.84rem;color:var(--muted)}
.mini{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:.92rem}
.chip.on{background:var(--good);border-color:var(--good);color:var(--on-good)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick{display:grid;gap:6px}

/* log */
.log{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-weight:700;font-size:.95rem}
.field .hint{font-size:.82rem;color:var(--muted)}
.field input,.field textarea{width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;font:500 1rem var(--body)}
.field textarea{min-height:76px;resize:vertical}
.saved{display:flex;align-items:center;gap:8px;color:var(--good);font-weight:700;font-size:.92rem}

/* scores */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.val{font-variant-numeric:tabular-nums;font-weight:600;min-width:6.5rem}
.better{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;background:var(--good);color:var(--on-good);font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

.foot{display:grid;gap:10px;justify-items:start;font-size:.85rem;color:var(--muted)}
.confirm{display:grid;gap:10px;background:var(--soft);padding:14px;border-radius:12px;width:100%}
.confirm .chips{gap:10px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:80;max-width:calc(100% - 32px)}

/* timer */
#timer{position:fixed;inset:0;z-index:60;background:var(--tbg);color:var(--tfg);display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto;transition:background .3s}
#timer[data-phase="hard"]{background:var(--thard)}
#timer[data-phase="easy"]{background:var(--teasy)}
.t-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.t-label{font-family:var(--display);font-weight:700;font-size:1.5rem;text-transform:uppercase;line-height:1}
.t-sub{color:var(--tmuted);font-size:.95rem;font-variant-numeric:tabular-nums}
#timer[data-phase] .t-sub,#timer[data-phase] .t-next{color:color-mix(in srgb,var(--tfg) 75%,transparent)}
.t-icon{min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--tline);background:transparent;color:var(--tfg);font-weight:700;font-size:.82rem;flex:none}
.t-bar{height:6px;border-radius:3px;background:var(--tline);overflow:hidden}
.t-bar i{display:block;height:100%;width:0;background:var(--tfg)}
.t-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;min-height:0}
.t-big{font-family:var(--display);font-weight:700;font-size:clamp(5.5rem,31vw,11rem);line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.t-move{font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,10vw,3.6rem);text-transform:uppercase;line-height:.95;text-wrap:balance}
.t-x{color:var(--tmuted);font-size:1rem}
.t-next{color:var(--tmuted);font-size:1.05rem;margin-top:6px}
.t-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:4px;font-size:1rem;color:var(--tmuted);text-align:left}
.t-list b{color:var(--tfg);font-family:var(--display);font-size:1.2rem;display:inline-block;width:2.4rem}
.t-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t-ctrl .wide{grid-column:1/-1}
.t-btn{min-height:56px;border-radius:14px;border:1.5px solid var(--tline);background:transparent;color:var(--tfg);font-weight:700;font-size:1.05rem}
.t-btn.go{background:var(--tfg);color:var(--tbg);border-color:var(--tfg);min-height:76px;font-size:1.35rem;font-family:var(--display);text-transform:uppercase;letter-spacing:.03em}
.t-confirm{display:grid;gap:10px;background:color-mix(in srgb,var(--tfg) 10%,transparent);border-radius:14px;padding:14px}
.t-tog{display:flex;gap:6px;flex:none}
.t-big:empty{display:none}
#timer[data-mode="setup"] .t-move{font-size:clamp(2.3rem,11vw,3.6rem)}
#timer[data-mode="setup"] .t-x{font-size:1.2rem;line-height:1.4;color:var(--tfg);max-width:28rem}
#timer[data-mode="steps"] .t-big{font-size:clamp(5rem,26vw,9rem)}
.t-extra{width:100%;max-width:26rem}
.t-extra:empty{display:none}

/* weights & settings */
.grow{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.gline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.glabel{font-weight:700}
.gnote{font-weight:500;color:var(--muted);font-size:.85rem}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:1.35rem;font-weight:700;line-height:1;padding:0}
.stepper input{width:4.4rem;min-height:44px;text-align:center;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 1.1rem var(--body);font-variant-numeric:tabular-nums}
.kg{font-size:.85rem;color:var(--muted);font-weight:600}
.gset{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;font:500 .95rem var(--body)}
.t-gear{text-align:left}
.t-gear .grow{border-color:var(--tline)}
.t-gear .stepper button{border-color:var(--tline);color:var(--tfg)}
.t-gear .stepper input,.t-gear .gset{background:transparent;color:var(--tfg);border-color:var(--tline)}
.t-gear .gnote,.t-gear .kg{color:var(--tmuted)}
@media (prefers-reduced-motion: reduce){#timer{transition:none}}
</style>

<div id="app" class="wrap"></div>
<div id="toast" hidden></div>

<script>
(function(){
const BUYIN=['1 km row','2 km bike','10 min incline walk/jog'];
const BUYOUT=['1 km row','2 km bike'];
const WARMUP={t:'warmup',title:'Warm-up',secs:300,text:'5 minutes easy on the rower, bike or elliptical.'};
const PHONE={t:'Prop your phone up',d:'Somewhere you can see it from every station, with the volume up. It will guide you from here.'};
const SESS=[
 {id:'upper',name:'Upper',day:'Tue',dur:'~38 min',
  arrive:[
   {t:'Find your corner',d:'Look for a spot where the rower, lat pulldown and a bench are close together. The EMOM moves between all of them every minute.'},
   {t:'Rower',d:'Set the monitor to show calories. Do your warm-up on it too.'},
   {t:'Lat pulldown',d:'Thigh pad: {pulldown_s}. Weight: {pulldown}.',g:['pulldown']},
   {t:'Bench',d:'Pull a bench close for push-ups. Hands on it if you need to.'},
   {t:'Dumbbells',d:'Grab 2 × {db} for shoulder press and leave them by the bench.',g:['db']},
   {t:'Burpee space',d:'Clear a bit of floor next to the bench.'},
   {t:'Later: cables',d:'Note where the cable machine is. The finisher uses it for rows and pushdowns.'},
   PHONE],
  blocks:[
  WARMUP,
  {t:'emom',title:'EMOM 25',text:'5 rounds of a 5-minute cycle. Start each move on the minute and rest for whatever is left.',rounds:5,moves:[
   {r:'12',n:'Cal row'},{r:'12',n:'Lat pulldowns'},{r:'10',n:'Push-ups',x:'Hands on a bench if needed'},{r:'12',n:'DB shoulder press'},{r:'8',n:'Step-back burpees'}]},
  {t:'circuit',title:'Finisher',rounds:2,moves:[{r:'12',n:'Cable rows'},{r:'12',n:'Cable tricep pushdowns'},{r:'12',n:'DB curls'},{r:'30s',n:'Plank',secs:30}],
   setup:[
    {t:'Cable row',d:'Attach the row handle. Seat: {cablerow_s}. Weight: {cablerow}.',g:['cablerow']},
    {t:'Tricep pushdown',d:'Attachment: {pushdown_s}, on the high pulley. Weight: {pushdown}.',g:['pushdown']},
    {t:'Curls and plank',d:'Bring your 2 × {db} dumbbells for curls, and grab a mat for the plank.',g:['db']}]}],
  log:[{id:'emom',label:'Finished each EMOM minute with time spare?',type:'choice',opts:['Every minute','Most minutes','Not yet']},
       {id:'db',label:'Dumbbell weight',type:'text',ph:'e.g. 6 kg'}]},
 {id:'lower',name:'Lower',day:'Thu',dur:'~40 min',
  arrive:[
   {t:'Find your spot',d:'A bench with clear floor around it for lunges, swings and burpees. Leave room to swing a kettlebell safely.'},
   {t:'Kettlebell',d:'Grab the {kb} kettlebell. Move up to 12 kg once your form and pace hold steady.',g:['kb']},
   {t:'Bench',d:'A flat, stable bench for step-ups.'},
   {t:'Warm-up',d:'Warm up on the elliptical if it’s free. You’ll finish on it later.'},
   {t:'Later: leg press, elliptical, mat',d:'Note where they are. You’ll use them after the AMRAP.'},
   PHONE],
  blocks:[
  WARMUP,
  {t:'amrap',title:'AMRAP 20',text:'As many rounds as you can in 20 minutes. Tap +1 each time you finish a round.',secs:1200,moves:[
   {r:'10',n:'Goblet squats',x:'Kettlebell'},{r:'12',n:'Reverse lunges',x:'6 per leg'},{r:'12',n:'Bench step-ups',x:'6 per leg'},{r:'10',n:'Kettlebell swings'},{r:'8',n:'Step-back burpees'}]},
  {t:'circuit',title:'Finisher 1',unit:'Set',rounds:2,moves:[{r:'20',n:'Seated leg press',x:'Light'}],
   setup:[{t:'Seated leg press',d:'Seat: {legpress_s}. Weight: {legpress}. Keep it light for 20 smooth reps.',g:['legpress']}]},
  {t:'intervals',title:'Finisher 2 · Cardio',text:'Elliptical: 1 minute hard, 1 minute easy, 5 rounds. Check the distance when you finish.',rounds:5,work:60,rest:60,
   setup:[{t:'Elliptical',d:'Reset the display, or note the distance, so you can check it at the end. 1 minute hard, 1 minute easy, 5 times.'}]},
  {t:'circuit',title:'Abs',rounds:2,moves:[{r:'30s',n:'Plank',secs:30},{r:'12',n:'Dead bugs',x:'6 per side'},{r:'15',n:'Bicycle crunches',x:'Total'},{r:'12',n:'Russian twists',x:'Total, bodyweight or light plate'}],
   setup:[{t:'Mat',d:'Grab a mat, and a light plate for Russian twists if you want one.'}]}],
  log:[{id:'rounds',label:'AMRAP rounds completed',type:'num'},{id:'reps',label:'Extra reps into the next round',type:'num'},
       {id:'dist',label:'Elliptical finisher distance',type:'text',ph:'e.g. 1.6 km'},{id:'kb',label:'Kettlebell used',type:'choice',opts:['8 kg','12 kg']}]},
 {id:'pilates',name:'Pilates',day:'Fri',dur:'30–40 min',blocks:[
  {t:'free',title:'Reformer Pilates',text:'Core, glutes and mobility. A class you like or a self-led flow.'}],
  log:[{id:'what',label:'Class or flow',type:'text',ph:'e.g. Friday reformer class'}]},
 {id:'full',name:'Full body',day:'Sat',dur:'~38–42 min',
  arrive:[
   {t:'Buy-in: {buyIn}',d:'Find the machine you’ll start on.'},
   {t:'Your station',d:'Set up right next to a bike or elliptical. You do 12 cal on it every round.'},
   {t:'Dumbbells',d:'2 × {db} for rows and curls.',g:['db']},
   {t:'Goblet squats',d:'The {kb} kettlebell.',g:['kb']},
   {t:'Mat',d:'A mat for burpees and sit-ups.'},
   {t:'Buy-out: {buyOut}',d:'Note where it is so you can go straight there after round 4.'},
   PHONE],
  blocks:[
  {t:'fortime',title:'Round Off',text:'For time. The clock runs from the start of the buy-in to the end of the buy-out.',rounds:4,moves:[
   {r:'8',n:'Burpees'},{r:'10',n:'DB rows'},{r:'12',n:'Goblet squats'},{r:'14',n:'Alt curls'},{r:'16',n:'Sit-ups'},{r:'12',n:'Cal bike or elliptical'}]}],
  log:[{id:'time',label:'Total time',type:'text',ph:'mm:ss'},{id:'buyIn',label:'Buy-in',type:'choice',opts:BUYIN},{id:'buyOut',label:'Buy-out',type:'choice',opts:BUYOUT},
       {id:'db',label:'Dumbbell weight',type:'text',ph:'e.g. 6 kg'}]}
];
SESS.forEach(s=>s.log.push({id:'notes',label:'Notes',type:'area',ph:'How did it feel? Anything to change next time?'}));
const ORDER=[];[1,2].forEach(w=>SESS.forEach(s=>ORDER.push({w,s})));
const byId=id=>SESS.find(s=>s.id===id);
const key=(w,id)=>'w'+w+'-'+id;

/* ---------- storage ---------- */
const LS='melBlock.v1',LSD='melBlock.drafts',LST='melBlock.timer',LSU='melBlock.ui',LSS='melBlock.sound',LSG='melBlock.gear',LSV='melBlock.voice';
const rd=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const wr=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let entries=rd(LS,{}),drafts=rd(LSD,{}),ui=rd(LSU,{view:'home'}),sound=rd(LSS,true),gear=rd(LSG,{}),voice=rd(LSV,false);

/* ---------- weights & machine settings ---------- */
const GEAR={
  db:{label:'Dumbbells',note:'each',step:1},
  kb:{label:'Kettlebell',step:4,def:8},
  pulldown:{label:'Lat pulldown',step:2.5,set:'Thigh pad setting'},
  cablerow:{label:'Cable row',step:2.5,set:'Seat setting'},
  pushdown:{label:'Tricep pushdown',step:2.5,set:'Rope or bar'},
  legpress:{label:'Leg press',step:5,set:'Seat setting'}
};
const saveGear=()=>wr(LSG,gear);

const speakable=t=>String(t).replace(/\bDB\b/g,'dumbbell').replace(/\bcal\b/gi,'calorie').replace(/\bAlt\b/g,'alternating')
  .replace(/×/g,'times').replace(/(\d)\s?kg\b/g,'$1 kilos').replace(/EMOM/g,'E-mom').replace(/AMRAP/g,'am-rap').replace(/[·–]/g,',');
function say(t){

let db=null,sync='local',pendingRender=false,confirmReset=false;

function draft(k){return drafts[k]||(drafts[k]={done:{},rounds:{},vals:{}})}

(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    db=await window.claude.use('db'); if(!db)return;
    let first=true;
    db.collection('log').onSnapshot(snap=>{
      snap.docChanges().forEach(c=>{
        if(c.type==='removed'){ if(!(entries[c.doc.id]&&entries[c.doc.id].pending)) delete entries[c.doc.id]; }
        else entries[c.doc.id]=c.doc.data();
      });
      if(first){first=false;
        Object.keys(entries).forEach(k=>{if(entries[k].pending)pushEntry(k)});
      }
      sync='synced';saveLocal();render();
    },()=>{sync='local';render()});
  }catch(e){}
})();
async function pushEntry(k){
  const e={...entries[k]};delete e.pending;
  if(!db){entries[k].pending=true;saveLocal();return}
  try{await db.doc('log/'+k).set(e);entries[k]=e;saveLocal()}
  catch(err){entries[k].pending=true;saveLocal()}
}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=sec=>{sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')};
const toSec=t=>{const m=String(t||'').match(/^(\d+):(\d{1,2})$/);return m?(+m[1])*60+(+m[2]):null};
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';

  if(!v)return'';

  if(id==='lower'){const a=[];if(v.rounds!==''&&v.rounds!=null)a.push(v.rounds+' rounds'+(+v.reps?' + '+v.reps+' reps':''));if(v.dist)a.push(v.dist);return a.join(' · ')}
  if(id==='full')return[v.time,(v.buyIn&&v.buyOut)?v.buyIn+' / '+v.buyOut:''].filter(Boolean).join(' · ');

   +'<button class="btn full" data-act="save">'+(e&&e.done?'Update log':'Finish and log session')+'</button></section>';

const METRICS=[
  {s:'upper',label:'Finished each EMOM minute with time spare?',get:v=>v.emom,score:v=>({'Every minute':3,'Most minutes':2,'Not yet':1})[v.emom]},
  {s:'lower',label:'AMRAP rounds completed',get:v=>(v.rounds!==''&&v.rounds!=null)?v.rounds+(+v.reps?' + '+v.reps+' reps':''):'',score:v=>v.rounds===''||v.rounds==null?null:(+v.rounds)*1000+(+v.reps||0)},

/* ---------- timer ---------- */
let T=rd(LST,null),lastS=null,tickH=null,wl=null,ac=null;
function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(f,d){
  if(!sound)return;
  try{unlockAudio();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.value=f||880;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.12));
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+(d||.12)+.03)}catch(e){}
}
const short=()=>beep(880,.12),long=()=>{beep(1320,.5);try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}};
async function wake(){try{if('wakeLock'in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(T&&!T.fin&&document.visibilityState==='visible'){wake();tick()}});
const elapsed=()=>T?((T.pausedAt||Date.now())-T.startedAt-T.pausedMs)/1000:0;
const saveT=()=>wr(LST,T);

function startTimer(cfg){
  unlockAudio();
  const lead=cfg.lead==null?5:cfg.lead;
  T=Object.assign({pausedAt:null,pausedMs:0,count:0,idx:0,stepAt:null,fin:null,confirm:false},cfg,{startedAt:Date.now()+lead*1000});
  saveT();openTimer();wake();say(introText());
}
const stepSpeech=st=>st.secs?st.text+', '+st.secs+' seconds':st.reps+' '+st.text;
const setupVals=()=>T&&T.after?draft(key(T.after.w,T.after.sid)).vals:{};
function setupSpeech(){const st=T.steps[T.idx],v=setupVals();return fill(st.t,v)+'. '+fill(st.d,v)}
function introText(){
  if(T.type==='setup')return setupSpeech();
  if(T.type==='emom'||T.type==='amrap')return T.label+'. First: '+T.moves[0].r+' '+T.moves[0].n;
  if(T.type==='intervals')return 'Intervals. Hard first.';
  if(T.type==='fortime')return T.label+'. Buy-in: '+T.steps[0].text;
  if(T.type==='steps')return T.label+'. '+stepSpeech(T.steps[0]);
  return T.move;
}
function canRun(sid,w,bi){
  const b=byId(sid).blocks[bi];if(!b||b.t==='free')return false;
  if(b.t==='fortime'){const v=draft(key(w,sid)).vals;return !!(v.buyIn&&v.buyOut)}
  return true;
}
function startPart(sid,w,bi,skipSetup){
  const b=byId(sid).blocks[bi];
  if(!skipSetup&&b.setup&&b.setup.length)return startTimer({type:'setup',steps:b.setup,label:'Set up · '+b.title,after:{sid,w,bi},lead:0});
  blockTimer(sid,w,bi);
}
function startSession(sid,w){
  const s=byId(sid);
  startTimer({type:'setup',steps:s.arrive,label:'Set up · '+s.name,after:{sid,w,bi:0,arrive:true},lead:0});
}
function afterSetup(){
  const a=T.after;closeTimer();
  ui={view:'session',w:a.w,sid:a.sid};saveUi();render();
  if(canRun(a.sid,a.w,a.bi))startPart(a.sid,a.w,a.bi,!a.arrive);
}
function blockTimer(sid,w,bi){
  const s=byId(sid),b=s.blocks[bi],ref={k:key(w,sid),bi},title=s.name+' · '+b.title;
  if(b.t==='warmup')return startTimer({type:'countdown',secs:b.secs,label:'Warm-up',move:'Warm-up',x:b.text,ref,title});
  if(b.t==='emom')return startTimer({type:'emom',rounds:b.rounds,moves:b.moves,label:b.title,ref,title});
  if(b.t==='amrap')return startTimer({type:'amrap',secs:b.secs,moves:b.moves,label:b.title,ref,title});
  if(b.t==='intervals')return startTimer({type:'intervals',rounds:b.rounds,work:b.work,rest:b.rest,label:'Elliptical intervals',ref,title});
  if(b.t==='fortime'){
    const v=draft(ref.k).vals,steps=[{label:'Buy-in',text:v.buyIn}];
    for(let r=1;r<=b.rounds;r++)b.moves.forEach((m,i)=>steps.push({label:'Round '+r+' of '+b.rounds+' · move '+(i+1)+' of '+b.moves.length,text:m.r+' '+m.n}));
    steps.push({label:'Buy-out',text:v.buyOut});
    return startTimer({type:'fortime',steps,label:b.title,ref,title,lead:3});
  }
  if(b.t==='circuit'){
    const u=b.unit||'Round',L=b.moves.length,steps=[];
    for(let r=1;r<=b.rounds;r++)b.moves.forEach((m,i)=>steps.push({label:u+' '+r+' of '+b.rounds+(L>1?' · '+(i+1)+' of '+L:''),reps:m.r,text:m.n,x:m.x||'',secs:m.secs||0}));
    return startTimer({type:'steps',steps,label:b.title,ref,title,lead:0});
  }
}
function openTimer(){
  let o=document.getElementById('timer');
  if(!o){o=document.createElement('div');o.id='timer';o.setAttribute('role','dialog');o.setAttribute('aria-label','Workout timer');document.body.appendChild(o)}
  o.dataset.mode=T.type;
  o.innerHTML='<div class="t-top"><div><div class="t-label" id="tLabel"></div><div class="t-sub" id="tSub"></div></div>'
    +'<div class="t-tog"><button class="t-icon" data-act="t-sound" id="tSound"></button><button class="t-icon" data-act="t-voice" id="tVoice"></button></div></div>'
    +'<div class="t-bar"><i id="tBar"></i></div>'
    +'<div class="t-main" aria-live="polite"><div class="t-big" id="tBig"></div><div class="t-move" id="tMove"></div><div class="t-x" id="tX"></div><div class="t-next" id="tNext"></div><div id="tExtra" class="t-extra"></div></div>'
    +'<div id="tCtrl"></div>';
  document.documentElement.style.overflow='hidden';
  lastS=null;renderCtrl();renderExtra();tick();
  clearInterval(tickH);tickH=setInterval(tick,200);
}
function closeTimer(){
  clearInterval(tickH);T=null;saveT();
  const o=document.getElementById('timer');if(o)o.remove();
  document.documentElement.style.overflow='';
  try{wl&&wl.release()}catch(e){}wl=null;
}
function renderExtra(){
  const x=document.getElementById('tExtra');if(!x||!T)return;
  if(T.type==='amrap'&&!T.fin)x.innerHTML='<ul class="t-list">'+T.moves.map(m=>'<li><b>'+esc(m.r)+'</b>'+esc(m.n)+'</li>').join('')+'</ul>';
  else if(T.type==='setup'){const g=T.steps[T.idx].g;x.innerHTML=g?'<div class="t-gear">'+g.map(id=>gearRow(id,'-t')).join('')+'</div>':''}
  else x.innerHTML='';
}
function renderCtrl(){
  const c=document.getElementById('tCtrl');if(!c||!T)return;
  setT('tSound',sound?'Beeps on':'Beeps off');setT('tVoice',voice?'Voice on':'Voice off');
  if(T.type==='setup'){
    const last=T.idx>=T.steps.length-1,nb=byId(T.after.sid).blocks[T.after.bi];
    c.innerHTML='<div class="t-ctrl"><button class="t-btn go wide" data-act="t-next">'+(last?'Ready · start '+esc(nb.title):'Got it · next')+'</button>'
      +(T.idx>0?'<button class="t-btn" data-act="t-back">Back</button>':'<button class="t-btn" data-act="t-close">Close</button>')
      +'<button class="t-btn" data-act="t-skip">Skip setup</button></div>';return;
  }
  if(T.fin){
    const np=nextPart();
    c.innerHTML='<div class="t-ctrl">'+(!T.ref?'<button class="t-btn go wide" data-act="t-close">Done</button>'
      :np?'<button class="t-btn go wide" data-act="t-nextpart">Next: '+esc(np.b.title)+'</button><button class="t-btn" data-act="t-save">Save and close</button><button class="t-btn" data-act="t-close">Close without saving</button>'
      :'<button class="t-btn go wide" data-act="t-save">Save to session</button><button class="t-btn wide" data-act="t-close">Close without saving</button>')+'</div>';return;
  }
  if(T.confirm){
    c.innerHTML='<div class="t-confirm"><span>Stop the timer here?</span><div class="t-ctrl"><button class="t-btn" data-act="t-keep">Keep going</button><button class="t-btn" data-act="t-end">Stop here</button></div></div>';return;
  }
  let main='';
  if(T.type==='amrap')main='<button class="t-btn go wide" data-act="t-plus">+1 round</button>';
  if(T.type==='fortime')main='<button class="t-btn go wide" data-act="t-next">Done · next</button>';
  if(T.type==='steps'){const st=T.steps[T.idx];
    main=st.secs&&T.stepAt==null?'<button class="t-btn go wide" data-act="t-stepgo">Start '+st.secs+'s</button>'
      :'<button class="t-btn go wide" data-act="t-next">'+(st.secs?'Skip · next':'Done · next')+'</button>'}
  const extra=T.type==='amrap'?'<button class="t-btn" data-act="t-minus">−1 round</button>':(T.type==='fortime'||T.type==='steps')?'<button class="t-btn" data-act="t-back">Back a step</button>':'';
  c.innerHTML='<div class="t-ctrl">'+main+'<button class="t-btn" data-act="t-pause">'+(T.pausedAt?'Resume':'Pause')+'</button>'+(extra||'')+'<button class="t-btn'+(extra?' wide':'')+'" data-act="t-stop">Stop</button></div>';
}
function nextPart(){
  if(!T||!T.ref)return null;
  const p=T.ref.k.split('-'),s=byId(p[1]),bi=T.ref.bi+1;
  return s&&s.blocks[bi]?{w:+p[0].slice(1),s,bi,b:s.blocks[bi]}:null;
}
function saveTimerResult(){
  const r=T.ref,d=draft(r.k);d.done[r.bi]=true;
  if(T.type==='amrap')d.vals.rounds=String(T.count);
  if(T.type==='fortime'&&T.idx>=T.steps.length)d.vals.time=fmt(T.fin.e);
  if(T.type==='steps'&&T.idx>=T.steps.length)d.rounds[r.bi]=byId(r.k.split('-')[1]).blocks[r.bi].rounds;
  saveDrafts();
}
function setT(id,v){const n=document.getElementById(id);if(n&&n.textContent!==v)n.textContent=v}
function finish(){
  if(!T||T.fin)return;
  T.fin={e:Math.max(0,elapsed())};T.confirm=false;if(!T.pausedAt)T.pausedAt=Date.now();
  saveT();long();setTimeout(long,600);renderCtrl();renderExtra();tick();
  const np=nextPart();
  say(!T.ref?'Done.':(T.type==='amrap'?T.count+' rounds. ':'')+(T.type==='intervals'?'Done. Check your distance.':'Done.')
    +(np?' Next up: '+np.b.title+'.':' Session complete. Log your scores.'));
}
function advance(){
  T.idx++;T.stepAt=null;T._lr=null;
  if(T.idx>=T.steps.length){T.idx=T.steps.length;saveT();return finish()}
  saveT();short();renderCtrl();
  const st=T.steps[T.idx];say(T.type==='steps'?stepSpeech(st):st.text);tick();
}
function tick(){
  if(!T)return;
  const o=document.getElementById('timer');if(!o)return;
  const e=elapsed(),s=Math.floor(e),crossed=s!==lastS&&!T.pausedAt;lastS=s;
  setT('tLabel',T.label);
  let big='',move='',x='',next='',sub='',bar=0,phase='';
  if(T.type==='setup'){
    const st=T.steps[T.idx],nx=T.steps[T.idx+1],v=setupVals();
    move=fill(st.t,v);x=fill(st.d,v);sub='Step '+(T.idx+1)+' of '+T.steps.length;
    next=nx?'Next: '+fill(nx.t,v):'';bar=(T.idx+1)/T.steps.length;
  }else if(T.fin){
    bar=1;
    if(T.type==='amrap'){big=String(T.count);move=T.count===1?'round':'rounds';x='Add any extra reps when you log the session.'}
    else if(T.type==='fortime'){big=fmt(T.fin.e);move=T.idx>=T.steps.length?'Finished':'Stopped';x=T.idx>=T.steps.length?'Total time':'Stopped at step '+(T.idx+1)+' of '+T.steps.length}
    else if(T.type==='intervals'){big=fmt(T.fin.e);move='Intervals done';x='Check the distance on the elliptical.'}
    else if(T.type==='steps'){big=fmt(T.fin.e);move=T.label+' done'}
    else{big=fmt(T.fin.e);move=T.type==='emom'?'EMOM done':'Done'}
    sub=T.title||'';
  }else if(e<0){
    big=String(Math.ceil(-e));move='Get ready';
    const f=T.type==='emom'||T.type==='amrap'?T.moves[0].r+' '+T.moves[0].n:T.type==='fortime'?T.steps[0].text:T.type==='intervals'?'Hard first':'';
    next=f?'First: '+f:'';
    if(crossed&&s>=-3)short();
  }else if(T.type==='emom'){
    const L=T.moves.length,total=T.rounds*L*60;
    if(e>=total){finish();return}
    const m=Math.floor(e/60),mv=T.moves[m%L],nm=T.moves[(m+1)%L];
    big=fmt(Math.ceil(60-(e-m*60)));move=mv.r+' '+mv.n;x=mv.x||'';
    next=m+1<T.rounds*L?'Next: '+nm.r+' '+nm.n:'Last minute';
    sub='Minute '+(m+1)+' of '+(T.rounds*L)+' · Round '+(Math.floor(m/L)+1)+' of '+T.rounds;bar=e/total;
    if(crossed){const r=s%60;if(r===0)long();else if(r>=57)short();if(r===50&&m+1<T.rounds*L)say('Next: '+nm.r+' '+nm.n)}
  }else if(T.type==='amrap'){
    if(e>=T.secs){finish();return}
    big=fmt(Math.ceil(T.secs-e));move=T.count+(T.count===1?' round':' rounds');sub=fmt(e)+' gone';bar=e/T.secs;
    if(crossed){const left=T.secs-s;if(s===0)long();else if(left<=3)short();else if(left===T.secs/2){short();setTimeout(short,250);say('Halfway')}else if(left===60)say('One minute left')}
  }else if(T.type==='intervals'){
    const seg=T.work+T.rest,total=T.rounds*seg;
    if(e>=total){finish();return}
    const r=Math.floor(e/seg),inR=e-r*seg,hard=inR<T.work,rem=hard?T.work-inR:seg-inR;
    big=fmt(Math.ceil(rem));move=hard?'Hard':'Easy';phase=hard?'hard':'easy';
    sub='Round '+(r+1)+' of '+T.rounds;bar=e/total;
    next=hard?'Then 1 min easy':(r+1<T.rounds?'Then 1 min hard':'Last one');
    if(crossed){const ir=s%seg;if(ir===0||ir===T.work){long();if(s>0)say(ir===0?'Hard':'Easy')}else if((ir>=T.work-3&&ir<T.work)||ir>=seg-3)short()}
  }else if(T.type==='countdown'){
    if(e>=T.secs){finish();return}
    big=fmt(Math.ceil(T.secs-e));move=T.move;x=T.x||'';bar=e/T.secs;
    if(crossed){const left=T.secs-s;if(s===0)long();else if(left<=3)short();else if(left===60&&T.secs>=120)say('One minute left')}
  }else if(T.type==='fortime'){
    const st=T.steps[T.idx],nx=T.steps[T.idx+1];
    big=fmt(e);move=st.text;sub=st.label;x='Step '+(T.idx+1)+' of '+T.steps.length;
    next=nx?'Next: '+nx.text:'Last one. Finish strong.';bar=T.idx/T.steps.length;
    if(crossed&&s===0)long();
  }else if(T.type==='steps'){
    const st=T.steps[T.idx],nx=T.steps[T.idx+1];
    sub=st.label;move=st.text;x=st.x;bar=T.idx/T.steps.length;
    next=nx?'Next: '+(nx.secs?nx.text+' · '+nx.secs+'s':nx.reps+' '+nx.text):'Last one';
    if(!st.secs)big=st.reps;
    else if(T.stepAt==null)big=fmt(st.secs);
    else{const rem=st.secs-(e-T.stepAt);if(rem<=0)return advance();
      const rw=Math.ceil(rem);big=fmt(rw);if(rw!==T._lr){T._lr=rw;if(rw<=3&&!T.pausedAt)short()}}
  }
  if(T.pausedAt&&!T.fin)sub=(sub?sub+' · ':'')+'Paused';
  setT('tBig',big);setT('tMove',move);setT('tX',x);setT('tNext',next);setT('tSub',sub);
  if((o.dataset.phase||'')!==phase){if(phase)o.dataset.phase=phase;else delete o.dataset.phase}
  document.getElementById('tBar').style.width=Math.min(100,bar*100)+'%';
}

/* ---------- actions ---------- */
document.addEventListener('input',ev=>{
  const t=ev.target,d=t.dataset||{};
  if(d.g){const n=parseFloat(t.value);gear[d.g]={...(gear[d.g]||{}),w:isNaN(n)?null:n};saveGear();tick()}
  else if(d.gs){gear[d.gs]={...(gear[d.gs]||{}),s:t.value};saveGear();tick()}
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,k=ui.sid?key(ui.w,ui.sid):null;
  switch(a){
    case 'home':return go('home');
    case 'scores':return go('scores');
    case 'open':return go('session',{w:+b.dataset.w,sid:b.dataset.s});
    case 'session-start':return startSession(ui.sid,ui.w);
    case 'start':return startPart(ui.sid,ui.w,+b.dataset.bi);
    case 'mini':return startTimer({type:'countdown',secs:+b.dataset.secs,label:b.dataset.n,move:b.dataset.n,lead:3});
    case 'done':{const d=draft(k),bi=+b.dataset.bi;d.done[bi]=!d.done[bi];saveDrafts();return render()}
    case 'round':{const d=draft(k),bi=+b.dataset.bi,r=+b.dataset.r,blk=byId(ui.sid).blocks[bi];
      d.rounds[bi]=(d.rounds[bi]||0)===r?r-1:r;d.done[bi]=d.rounds[bi]>=blk.rounds;saveDrafts();return render()}
    case 'pick':{const d=draft(k),f=b.dataset.f;d.vals[f]=d.vals[f]===b.dataset.v?'':b.dataset.v;saveDrafts();return render()}
    case 'save':{
      const d=draft(k);
      app.querySelectorAll('[data-f]').forEach(n=>{if(n.tagName==='INPUT'||n.tagName==='TEXTAREA')d.vals[n.dataset.f]=n.value});
      const prev=entries[k];
      entries[k]={done:true,date:(prev&&prev.date)||new Date().toISOString(),vals:{...d.vals}};
      saveLocal();saveDrafts();pushEntry(k);
      toast(byId(ui.sid).name+' logged');return go('home');
    }
    case 'reset-ask':confirmReset=true;return render();
    case 'reset-no':confirmReset=false;return render();
    case 'reset-yes':{
      const ks=Object.keys(entries);entries={};drafts={};saveLocal();saveDrafts();confirmReset=false;
      if(db)ks.forEach(x=>{db.doc('log/'+x).delete().catch(()=>{})});
      toast('New block started');return render();
    }
    case 'g-up':case 'g-dn':{
      const id=b.dataset.g,G=GEAR[id],cur=gw(id);
      let n=cur==null?(a==='g-up'?G.step:0):cur+(a==='g-up'?G.step:-G.step);n=Math.max(0,Math.round(n*10)/10);
      gear[id]={...(gear[id]||{}),w:n};saveGear();
      document.querySelectorAll('input[data-g="'+id+'"]').forEach(i=>{i.value=n});return tick();
    }
    case 't-sound':sound=!sound;wr(LSS,sound);if(sound){unlockAudio();short()}renderCtrl();return render();
    case 't-voice':voice=!voice;wr(LSV,voice);if(voice)say('Voice cues on');renderCtrl();return render();
    case 't-pause':
      if(T.pausedAt){T.pausedMs+=Date.now()-T.pausedAt;T.pausedAt=null;wake()}else T.pausedAt=Date.now();
      saveT();renderCtrl();return tick();
    case 't-stop':T.confirm=true;return renderCtrl();
    case 't-keep':T.confirm=false;return renderCtrl();
    case 't-end':return finish();
    case 't-plus':T.count++;saveT();short();return tick();
    case 't-minus':T.count=Math.max(0,T.count-1);saveT();return tick();
    case 't-stepgo':T.stepAt=Math.max(0,elapsed());T._lr=null;saveT();short();return renderCtrl();
    case 't-next':
      if(T.type==='setup'){
        T.idx++;if(T.idx>=T.steps.length)return afterSetup();
        saveT();renderCtrl();renderExtra();say(setupSpeech());return tick();
      }
      if(elapsed()<0)return;
      return advance();
    case 't-back':
      T.idx=Math.max(0,T.idx-1);T.stepAt=null;T._lr=null;saveT();renderCtrl();
      if(T.type==='setup'){renderExtra();say(setupSpeech())}
      return tick();
    case 't-skip':T.after.arrive=false;return afterSetup();
    case 't-save':saveTimerResult();closeTimer();toast('Saved to session');return render();
    case 't-nextpart':{
      const np=nextPart();saveTimerResult();closeTimer();
      ui={view:'session',w:np.w,sid:np.s.id};saveUi();render();
      if(canRun(np.s.id,np.w,np.bi))return startPart(np.s.id,np.w,np.bi);
      const card=document.getElementById('part-'+np.bi);if(card)card.scrollIntoView({block:'start'});
      return;
    }
    case 't-close':closeTimer();return render();
  }
});

render();
if(T){ if(Date.now()-T.startedAt<4*3600*1000)openTimer(); else {T=null;saveT()} }
})();
</script>
